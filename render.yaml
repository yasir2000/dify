services:
  - type: web
    name: dify-api
    env: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 80
      targetCPUPercent: 70
    envVars:
      - key: MODE
        value: api
      - key: DB_USERNAME
        fromDatabase:
          name: dify-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dify-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: dify-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dify-db
          property: port
      - key: REDIS_HOST
        fromDatabase:
          name: dify-redis
          property: host
      - key: REDIS_PORT
        fromDatabase:
          name: dify-redis
          property: port
      - key: REDIS_PASSWORD
        fromDatabase:
          name: dify-redis
          property: password
    disk:
      name: dify-storage
      mountPath: /app/api/storage
      sizeGB: 20

  - type: worker
    name: dify-worker
    env: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    envVars:
      - key: MODE
        value: worker
    disk:
      name: dify-storage
      mountPath: /app/api/storage
      sizeGB: 20
      
  - type: web
    name: dify-web
    env: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    envVars:
      - key: CONSOLE_API_URL
        sync: false
      - key: APP_API_URL
        sync: false
      - key: TEXT_GENERATION_TIMEOUT_MS
        value: "60000"
      - key: MARKETPLACE_API_URL
        value: "https://marketplace.dify.ai"
      - key: PM2_INSTANCES
        value: "2"
    metrics:
      - type: cpu
      - type: memory

databases:
  - name: dify-db
    databaseName: dify
    user: postgres
    plan: standard
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  - name: dify-redis
    type: redis
    plan: standard
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    maxmemoryPolicy: noeviction
    settings:
      maxmemory: 512MB

envVarGroups:
  - name: dify-shared
    envVars:
      - key: CONSOLE_API_URL
        sync: false
      - key: CONSOLE_WEB_URL
        sync: false
      - key: SERVICE_API_URL
        sync: false
      - key: APP_API_URL
        sync: false
      - key: APP_WEB_URL
        sync: false
      - key: FILES_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: "false"
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_TYPE
        value: opendal
      - key: DEPLOY_ENV
        value: PRODUCTION
      - key: INIT_PASSWORD
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: SQLALCHEMY_POOL_SIZE
        value: "30"
      - key: UPLOAD_FILE_SIZE_LIMIT
        value: "15"
